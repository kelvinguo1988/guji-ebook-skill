<h1 class="doctitle">凡例</h1><p class="noindent"><b>一、底本。</b>文字以排印整理本为底，参风陵文库藏清写刻本（书影随文）。</p><p class="noindent"><b>二、体例。</b>每节先陈原文（繁体，附徐乐吾评注），继以白话通释、术语笺释与今人按语。</p><p class="noindent"><b>三、用字。</b>原文、评注用繁体；白话、按语用简体。</p><p class="noindent"><b>四、结构。</b>全书按十天干分十卷，卷内以十二月令立目，凡一百一十三节。</p>
